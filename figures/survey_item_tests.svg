<svg xmlns="http://www.w3.org/2000/svg" width="820" height="424" viewBox="0 0 820 424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="820" height="424" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="600">Which survey items drew a significant majority response?</text>
<text x="24.0" y="56.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">One-sided z-test of H₁: favourable-response proportion &gt; 50% (n = 54). Longer bar = stronger evidence.</text>
<line x1="330.0" y1="84" x2="330.0" y2="364" stroke="#d0d7de"/>
<text x="330.0" y="382.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">1</text>
<line x1="412.0" y1="84" x2="412.0" y2="364" stroke="#d0d7de"/>
<text x="412.0" y="382.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0.1</text>
<line x1="494.0" y1="84" x2="494.0" y2="364" stroke="#d0d7de"/>
<text x="494.0" y="382.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0.01</text>
<line x1="576.0" y1="84" x2="576.0" y2="364" stroke="#d0d7de"/>
<text x="576.0" y="382.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0.001</text>
<line x1="658.0" y1="84" x2="658.0" y2="364" stroke="#d0d7de"/>
<text x="658.0" y="382.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0.0001</text>
<line x1="740.0" y1="84" x2="740.0" y2="364" stroke="#d0d7de"/>
<text x="740.0" y="382.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">1e-05</text>
<text x="535.0" y="404.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">p-value (log scale)</text>
<line x1="436.7" y1="72" x2="436.7" y2="364" stroke="#1f2328" stroke-dasharray="4,3"/>
<text x="441.7" y="82.0" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">p = 0.05</text>
<rect x="330" y="98" width="357.0" height="22" fill="#1a7f37" rx="3"/>
<text x="318.0" y="113.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="600">Used extra resources for help?</text>
<rect x="330" y="132" width="266.4" height="22" fill="#1a7f37" rx="3"/>
<text x="318.0" y="147.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="600">Attend live lecture if it's recorded?</text>
<rect x="330" y="166" width="115.9" height="22" fill="#1a7f37" rx="3"/>
<text x="318.0" y="181.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="600">More or less stressed online?</text>
<rect x="330" y="200" width="103.3" height="22" fill="#8c959f" rx="3"/>
<text x="318.0" y="215.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="normal">Prefer pre-recorded or live lectures?</text>
<rect x="330" y="234" width="15.2" height="22" fill="#8c959f" rx="3"/>
<text x="318.0" y="249.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="normal">Satisfaction with online learning (1–5)</text>
<rect x="330" y="268" width="15.2" height="22" fill="#8c959f" rx="3"/>
<text x="318.0" y="283.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="normal">Online tests reflect your knowledge?</text>
<rect x="330" y="302" width="2.0" height="22" fill="#8c959f" rx="3"/>
<text x="318.0" y="317.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="normal">Experienced technical difficulties?</text>
<rect x="330" y="336" width="2.0" height="22" fill="#8c959f" rx="3"/>
<text x="318.0" y="351.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="normal">Concentration during online lectures?</text>
</svg>
